<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Gamer RPG - Anatoly's Story</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #000;
            overflow: hidden;
        }

        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
            background: #1a1a1a;
        }

        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            z-index: 9999;
        }

        #loading h1 {
            font-size: 48px;
            margin-bottom: 20px;
            color: #4ef9ff;
            text-shadow: 0 0 20px #4ef9ff;
        }

        #loading p {
            font-size: 18px;
            color: #aaa;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #333;
            border-top: 5px solid #4ef9ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px 0;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #controls {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(20, 20, 30, 0.8);
            border: 2px solid rgba(100, 150, 255, 0.5);
            border-radius: 8px;
            padding: 15px;
            color: white;
            font-size: 14px;
            max-width: 300px;
        }

        #controls h3 {
            margin-bottom: 10px;
            color: #4ef9ff;
        }

        #controls ul {
            list-style: none;
        }

        #controls li {
            margin: 5px 0;
            padding-left: 10px;
        }

        #controls kbd {
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 6px;
            border-radius: 3px;
            font-family: monospace;
            color: #4ef9ff;
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading">
        <h1>🎮 THE GAMER RPG 🎮</h1>
        <div class="spinner"></div>
        <p>Loading Anatoly's Story...</p>
    </div>

    <!-- Game Canvas -->
    <canvas id="gameCanvas"></canvas>

    <!-- Controls Help -->
    <div id="controls">
        <h3>⌨️ Controls</h3>
        <ul>
            <li><kbd>WASD</kbd> Move</li>
            <li><kbd>Shift</kbd> Run</li>
            <li><kbd>Space</kbd> Jump</li>
            <li><kbd>Right Mouse</kbd> Rotate Camera</li>
            <li><kbd>Mouse Wheel</kbd> Zoom</li>
            <li><kbd>Tab</kbd> Show Status</li>
        </ul>
        <br>
        <h3>🎮 Console Commands</h3>
        <ul>
            <li><code>gamerAbility.showStatus()</code></li>
            <li><code>anatolyStats.gainExp(100)</code></li>
            <li><code>gamerAbility.observe(zombie)</code></li>
        </ul>
    </div>

    <!-- Load Game -->
    <script type="module" src="anatoly-demo.js"></script>
    <script>
        // Hide loading screen when game starts
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('loading').style.display = 'none';
            }, 2000);
        });
    </script>
</body>
</html>
