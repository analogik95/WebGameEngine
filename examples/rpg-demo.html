<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Gamer RPG - Demo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #000;
      overflow: hidden;
    }

    #gameCanvas {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: pointer;
    }

    #loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 24px;
      text-align: center;
      z-index: 10000;
    }

    #instructions {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 15px 30px;
      border-radius: 10px;
      border: 2px solid #ffaa00;
      font-size: 14px;
      z-index: 1001;
    }

    #instructions h3 {
      color: #ffaa00;
      margin-bottom: 10px;
    }

    #instructions p {
      margin: 5px 0;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <div id="loading">
    <h2>Loading The Gamer RPG...</h2>
    <p>Please wait...</p>
  </div>

  <div id="instructions">
    <h3>Controls</h3>
    <p><strong>WASD</strong> - Move | <strong>Shift</strong> - Sprint | <strong>Space</strong> - Jump</p>
    <p><strong>Mouse</strong> - Look Around | <strong>1-9</strong> - Use Skills</p>
    <p><strong>O</strong> - Observe | <strong>I</strong> - Inventory | <strong>K</strong> - Skills</p>
    <p><strong>T</strong> - Test Damage | <strong>Y</strong> - Test Heal | <strong>U</strong> - Gain EXP</p>
  </div>

  <script type="module">
    import { Engine } from '../dist/core/Engine.js';
    import { Scene } from '../dist/core/Scene.js';
    import { GameObject } from '../dist/core/GameObject.js';
    import { Camera } from '../dist/rendering/Camera.js';
    import { MeshRenderer } from '../dist/components/MeshRenderer.js';
    import { Light, LightType } from '../dist/components/Light.js';
    import { Mesh } from '../dist/rendering/Mesh.js';
    import { Material } from '../dist/rendering/Material.js';
    import { Shader } from '../dist/rendering/Shader.js';
    import { ShaderLibrary } from '../dist/rendering/ShaderLibrary.js';
    import { Vector3 } from '../dist/math/Vector3.js';
    import { Input } from '../dist/core/Input.js';

    // RPG Systems
    import { PlayerController } from '../dist/rpg/components/PlayerController.js';
    import { PlayerStats } from '../dist/rpg/systems/PlayerStats.js';
    import { SkillSystem } from '../dist/rpg/systems/SkillSystem.js';
    import { GamerAbilities } from '../dist/rpg/systems/GamerAbilities.js';
    import { GameUI } from '../dist/rpg/ui/GameUI.js';

    async function main() {
      try {
        console.log('🎮 Starting The Gamer RPG...');

        // Initialize engine
        const canvas = document.getElementById('gameCanvas');
        const engine = Engine.instance;
        await engine.initialize(canvas);

        // Create main scene
        const scene = engine.sceneManager.createScene('MainScene');

        // Create GL context
        const gl = engine.gl;
        if (!gl) {
          throw new Error('WebGL not available');
        }

        // ====================================================================
        // Setup Lighting
        // ====================================================================

        const sunObj = scene.createGameObject('Sun');
        const sun = sunObj.addComponent(Light);
        sun.type = LightType.Directional;
        sun.color = new Vector3(1, 0.95, 0.9);
        sun.intensity = 1;
        sunObj.transform.rotation = Quaternion.fromEuler(-45, 45, 0);

        // ====================================================================
        // Create Ground
        // ====================================================================

        const shader = new Shader(gl, ShaderLibrary.litVertexShader, ShaderLibrary.litFragmentShader);

        const groundObj = scene.createGameObject('Ground');
        const groundRenderer = groundObj.addComponent(MeshRenderer);
        groundRenderer.mesh = Mesh.createPlane(50, 50);

        const groundMaterial = new Material(shader);
        groundMaterial.color = new Vector3(0.3, 0.8, 0.3); // Green ground
        groundRenderer.material = groundMaterial;

        // ====================================================================
        // Create Camera
        // ====================================================================

        const cameraObj = scene.createGameObject('MainCamera');
        const camera = cameraObj.addComponent(Camera);
        cameraObj.transform.position = new Vector3(0, 5, 10);
        cameraObj.transform.lookAt(new Vector3(0, 0, 0));

        // ====================================================================
        // Create Player
        // ====================================================================

        const playerObj = scene.createGameObject('Player');
        const playerRenderer = playerObj.addComponent(MeshRenderer);
        playerRenderer.mesh = Mesh.createCube(1);

        const playerMaterial = new Material(shader);
        playerMaterial.color = new Vector3(1, 0.5, 0.2); // Orange player
        playerRenderer.material = playerMaterial;

        playerObj.transform.position = new Vector3(0, 0.5, 0);

        // ====================================================================
        // Setup RPG Systems
        // ====================================================================

        // Create player stats
        const playerData = {
          id: 1,
          name: 'Anatoly Petrauskas',
          level: 1,
          exp: 0,
          expToNext: 100,
          stats: {
            strength: 8,
            vitality: 9,
            dexterity: 11,
            intelligence: 14,
            wisdom: 10,
            luck: 12
          },
          resources: {
            hp: 90,
            maxHp: 90,
            mp: 140,
            maxMp: 140
          },
          money: 500
        };

        const playerStats = new PlayerStats(playerData);

        // Create skill system
        const skillSystem = new SkillSystem();
        skillSystem.learnSkill('energy_bolt');
        skillSystem.learnSkill('power_strike');
        skillSystem.learnSkill('heal');
        skillSystem.learnSkill('observe');
        skillSystem.learnSkill('id_create');
        skillSystem.learnSkill('id_escape');

        // Set hotkeys
        skillSystem.setHotkey('energy_bolt', 1);
        skillSystem.setHotkey('power_strike', 2);
        skillSystem.setHotkey('heal', 3);
        skillSystem.setHotkey('observe', 4);

        // Create Gamer abilities
        const gamerAbilities = new GamerAbilities();

        // Setup player controller
        const controller = playerObj.addComponent(PlayerController);
        controller.camera = camera;
        controller.setPlayerStats(playerStats);
        controller.setSkillSystem(skillSystem);

        // ====================================================================
        // Create UI
        // ====================================================================

        const gameUI = new GameUI();
        gameUI.setPlayerStats(playerStats);
        gameUI.setSkillSystem(skillSystem);

        // ====================================================================
        // Create Some Test Objects
        // ====================================================================

        // Test cubes
        for (let i = 0; i < 5; i++) {
          const cubeObj = scene.createGameObject(`Cube${i}`);
          const cubeRenderer = cubeObj.addComponent(MeshRenderer);
          cubeRenderer.mesh = Mesh.createCube(1);

          const cubeMaterial = new Material(shader);
          cubeMaterial.color = new Vector3(
            Math.random(),
            Math.random(),
            Math.random()
          );
          cubeRenderer.material = cubeMaterial;

          const angle = (i / 5) * Math.PI * 2;
          const radius = 5;
          cubeObj.transform.position = new Vector3(
            Math.cos(angle) * radius,
            0.5,
            Math.sin(angle) * radius
          );
        }

        // ====================================================================
        // Test Keybinds
        // ====================================================================

        let testUpdateInterval = 0;

        function testUpdate(deltaTime) {
          testUpdateInterval += deltaTime;

          // Update UI every frame
          if (testUpdateInterval >= 0.016) { // ~60fps
            gameUI.update();
            testUpdateInterval = 0;
          }

          // Test damage (T key)
          if (Input.getKeyDown('KeyT')) {
            playerStats.takeDamage(20);
            gameUI.showDamage(window.innerWidth / 2, window.innerHeight / 2, 20, false);
            console.log('Took 20 damage!');
          }

          // Test healing (Y key)
          if (Input.getKeyDown('KeyY')) {
            playerStats.heal(30);
            gameUI.showHealing(window.innerWidth / 2, window.innerHeight / 2, 30);
            console.log('Healed 30 HP!');
          }

          // Test EXP gain (U key)
          if (Input.getKeyDown('KeyU')) {
            const leveledUp = playerStats.addExp(50);
            if (leveledUp) {
              gameUI.showLevelUp(playerStats.level);
              console.log('LEVEL UP!');
            } else {
              console.log('Gained 50 EXP');
            }
          }

          // Test Observe (P key on a cube)
          if (Input.getKeyDown('KeyP')) {
            const observeData = {
              name: 'Test Cube',
              level: 5,
              hp: 100,
              maxHp: 100,
              description: 'A mysterious floating cube.',
              threat: 'low',
              weaknesses: ['Fire', 'Lightning'],
              drops: ['Cube Fragment', 'Magic Essence']
            };

            gameUI.showObserveWindow(observeData);
          }
        }

        // Add test update to engine
        engine.onUpdate = (deltaTime) => {
          testUpdate(deltaTime);
        };

        // ====================================================================
        // Load and Start Game
        // ====================================================================

        console.log('📦 Loading scene...');
        await engine.sceneManager.loadScene('MainScene');

        console.log('🚀 Starting game...');
        engine.start();

        // Hide loading screen
        document.getElementById('loading').style.display = 'none';

        console.log('✅ The Gamer RPG is running!');
        console.log('Player Stats:', playerStats.toJSON());
        console.log('Skills:', skillSystem.getAllSkills());

        // Welcome message
        setTimeout(() => {
          gameUI.showNotification('Welcome to The Gamer RPG!\nUse WASD to move, Mouse to look around', 5000);
        }, 1000);

      } catch (error) {
        console.error('❌ Error starting game:', error);
        document.getElementById('loading').innerHTML = `
          <h2>Error Loading Game</h2>
          <p>${error.message}</p>
          <p>Check console for details.</p>
        `;
      }
    }

    // Start the game
    main();
  </script>
</body>
</html>
