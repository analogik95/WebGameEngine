<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Game Engine Demo</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #1a1a1a;
    }

    #gameCanvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    #info {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      background: rgba(0, 0, 0, 0.7);
      padding: 15px;
      border-radius: 5px;
      font-size: 14px;
      max-width: 300px;
    }

    #info h2 {
      margin: 0 0 10px 0;
      font-size: 18px;
    }

    #info p {
      margin: 5px 0;
    }

    #controls {
      position: absolute;
      bottom: 10px;
      left: 10px;
      color: white;
      background: rgba(0, 0, 0, 0.7);
      padding: 15px;
      border-radius: 5px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <div id="info">
    <h2>Web Game Engine Demo</h2>
    <p>FPS: <span id="fps">0</span></p>
    <p>Objects: <span id="objects">0</span></p>
    <p>Frame: <span id="frame">0</span></p>
  </div>

  <div id="controls">
    <strong>Controls:</strong><br>
    WASD - Move Camera<br>
    Arrow Keys - Rotate View<br>
    Q/E - Move Up/Down<br>
    Mouse - Look Around
  </div>

    // Initialize
    const canvas = document.getElementById('gameCanvas');

    cameraObj.transform.position.set(0, 2, 5);
    cameraObj.transform.lookAt(new Vector3(0, 0, 0));

    // Create light
    const lightObj = scene.createGameObject('DirectionalLight');
    const light = lightObj.addComponent(Light);
    light.color.set(1, 1, 1);
    light.intensity = 1;
    lightObj.transform.rotation.setFromEuler(-Math.PI / 4, Math.PI / 4, 0);

      engine.gl,
      ShaderLibrary.litVertexShader,

    // Create sphere
    const sphereObj = scene.createGameObject('Sphere');
    const sphereRenderer = sphereObj.addComponent(MeshRenderer);
    sphereRenderer.mesh = Mesh.createSphere(0.5, 32);
    sphereRenderer.material = material;
    sphereObj.transform.position.set(2, 0, 0);

</html>
